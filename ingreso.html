<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Parthur-Tech - Ingreso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Parthur-Tech</h1>
    <p>Servicio técnico a domicilio</p>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="servicios.html">Servicios</a>
    <a href="nosotros.html">Nosotros</a>
    <a href="contacto.html">Contacto</a>
    <a href="registro.html">Registro</a>
    <a href="ingreso.html">Ingreso</a>
  </nav>

  <main>
    <section>
      <h2>Inicia sesión</h2>
      <p>Ingresa con tu correo y contraseña para ver el estado de tu equipo.</p>

      <form id="form-ingreso" novalidate>
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" autocomplete="email">
        <p class="error" id="error-correo"></p>

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" autocomplete="current-password">
        <p class="error" id="error-contrasena"></p>

        <button type="submit">Ingresar</button>
        <p class="error" id="form-exito"></p>
      </form>

      <p class="form-extra">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>

  <footer>
    <p>Parthur-Tech &copy; 2026</p>
    <p>Contacto: contacto@parthurtech.cl | +56 9 1234 5678</p>
  </footer>

  <script src="ingreso.js"></script>
</body>
</html>
